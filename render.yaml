services:
  - type: web
    name: septai-interviewer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_PATH
        value: /var/data/interviewer.db
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
